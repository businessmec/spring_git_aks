
name: Java CI with Maven and push to AKS


env:
  AZURE_CONTAINER_REGISTRY: githubtchiroma # set this to the name of your container registry
  PROJECT_NAME: spring_git_aks              # set this to your project's name
  RESOURCE_GROUP: ckad_resource_group          # set this to the resource group containing your AKS cluster
  CLUSTER_NAME: githubakscluster              # set this to the name of your AKS cluster
  REGISTRY_URL: githubtchiroma.azurecr.io              # set this to the URL of your registry
  # If you bake using helm:
  CHART_PATH: MY_HELM_FILE                   # set this to the path to your helm file
  CHART_OVERRIDE_PATH: MY_OVERRIDE_FILES     # set this to an array of override file paths
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  IMAGE_NAME: ${{ github.repository_owner }}/trivy-java-db-act
  IMAGE_TAG: ${{ github.sha }}
  #IMAGE_TAG: 1a79847513e6129677c8258e600e02a5c885c344


  #   IMAGE_NAME: ${{ github.repository_owner }}/trivy-checks-act



on:  push


jobs:

#  sonarqube:
#    name: SonarQube
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v3
#        with:
#          fetch-depth: 0
#      - name: SonarQubeScan
#        uses: SonarSource/sonarqube-scan-action@v6
#        env:
#          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: install java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: run maven package install
        run: mvn clean compile package
#Impossible to disable automatic scanning
   #   - name: Build with Maven
    #    run: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token=466bd99e1042e6348241690f1370aff46110431f -Dsonar.projectKey=businessmec_spring_git_aks -Dsonar.organization=businessmec

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          context : .
          name: java-app
          path: '${{ github.workspace }}/target/shuna.jar'
          retention-days: 1

      - name: Azure login
        id: connect_azure
        uses: azure/login@v1.4.3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: actions/checkout@v4
      - name: download jar to target
        uses: actions/download-artifact@v4
        with:
          context: .

          name: java-app
          path: target/



      - name: Build image on ACR
        id: build-push-acr
        uses: azure/acr-build@v1
        with:
          service_principal: ${{ secrets.SERVICE_PRINCIPAL }}
          service_principal_password: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
          tenant: ${{ secrets.AZURE_TENANT }}
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          repository: dindonneau
          image: spring_git_aks
          #folder: spring_git_aks
          branch: raw_code
          tag: ${{ env.IMAGE_TAG }}
          #build_args: 'ARTIFACT_NAME=target/spring_git_aks-0.0.1-SNAPSHOT.jar'
          path: '${{ github.workspace }}/target/*.jar'


  trivy_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        id: connect_azure
        uses: azure/login@v1.4.3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
   #   - name: Run Trivy scan
   #     uses: aquasecurity/trivy-action@master
   #     with:
   #       image-ref: ${{ env.REGISTRY_URL }}/dindonneau/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}
   #       format: "table"
   #       exit-code: 1
   #       ignore-unfixed: true
   #       severity: "CRITICAL,HIGH"
      - name: install docker trivy
        run: |
          docker pull aquasec/trivy:canary

      - name: docker run trivy
        run: |
          docker login githubtchiroma.azurecr.io --username  ${{ secrets.SERVICE_PRINCIPAL }} --password  ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
          docker pull githubtchiroma.azurecr.io/dindonneau/spring_git_aks:16431bd87bf13e1cb61458b8d032f77118f7281a
          docker ps
          docker run --rm -v /tmp:/tmp\
             -e AZURE_CLIENT_ID=${{ secrets.SERVICE_PRINCIPAL }} -e AZURE_CLIENT_SECRET=${{ secrets.SERVICE_PRINCIPAL_PASSWORD }} \
             -e AZURE_TENANT_ID=${{ secrets.AZURE_TENANT }} aquasec/trivy image ${{ env.REGISTRY_URL }}/dindonneau/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}
          
      

  azure-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Azure login
        id: connect_azure
        uses: azure/login@v1.4.3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: download jar to target
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: target/


      - name: Build image on ACR
        uses: azure/CLI@61bb69d64d613b52663984bf12d6bac8fd7b3cc8
        with:
          azcliversion: 2.29.1
          inlineScript: |
            az configure --defaults acr=${{ env.REGISTRY_URL }}
            echo ${{ env.PROJECT_NAME }}:${{ github.sha }}
            echo  ${{ env.AZURE_CONTAINER_REGISTRY }}
            az login --service-principal --username ${{ secrets.SERVICE_PRINCIPAL }} --password ${{  secrets.SERVICE_PRINCIPAL_PASSWORD }} --tenant ${{ secrets.AZURE_TENANT }}

            az acr build  --registry ${{ env.AZURE_CONTAINER_REGISTRY }} --image check/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} --resource-group ${{ env.RESOURCE_GROUP }} .
            
            
            
